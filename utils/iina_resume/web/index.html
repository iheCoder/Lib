<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>IINA Resume</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="page-title">
      <div class="brand" aria-hidden="true">
        <span class="brand-play"></span>
      </div>
      <p class="eyebrow">CONTINUE WATCHING</p>
      <h1 id="page-title">恢复上次播放会话</h1>

      <div id="loading" class="state">正在读取 IINA 播放记录…</div>
      <div id="empty" class="state hidden">
        <p>还没有可恢复的会话</p>
        <small>先用 IINA 打开视频并正常退出，再刷新这里。</small>
      </div>
      <div id="sessions" class="sessions hidden"></div>

      <p id="message" class="message" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="refresh" class="secondary" type="button">刷新记录</button>
      </div>
    </section>
    <p class="privacy">播放记录只从本机 IINA 读取，不会上传。</p>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
