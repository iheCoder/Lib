let categoryTabObserver=null;
function closeCategoryOverflow(){document.getElementById('categoryOverflow')?.remove();document.getElementById('categoryMoreButton')?.setAttribute('aria-expanded','false')}
function layoutCategoryTabs(){
 const nav=document.querySelector('#recommendScroll .tabline'),more=document.getElementById('categoryMoreButton');if(!nav||!more)return;
 closeCategoryOverflow();const cats=[...nav.querySelectorAll('[data-business-category]')];cats.forEach(b=>b.hidden=false);more.hidden=true;
 const fixed=[...nav.children].filter(b=>!b.hasAttribute('data-business-category')&&b!==more);
 const width=b=>{const c=getComputedStyle(b);return b.getBoundingClientRect().width+parseFloat(c.marginLeft||0)+parseFloat(c.marginRight||0)};
 const gap=parseFloat(getComputedStyle(nav).columnGap)||4;
 const base=fixed.reduce((n,b)=>n+width(b)+gap,0),sizes=cats.map(width),available=nav.clientWidth-base;
 const selected=cats.find(b=>b.dataset.id===tab);more.innerHTML='更多分类'+icon('down');more.classList.remove('active');more.hidden=false;
 // Reserve enough space to display a selected category from the folded list.
 if(selected)more.innerHTML=esc(selected.textContent.trim())+icon('down');
 const reserve=width(more)+gap;
 let used=0;const total=sizes.reduce((n,w)=>n+w+gap,0),needs=total>available||cats.length>4;
 cats.forEach((b,i)=>{const fit=!needs||(i<4&&used+sizes[i]+gap<=available-reserve);b.hidden=!fit;if(fit)used+=sizes[i]+gap});
 const folded=cats.filter(b=>b.hidden);more.hidden=folded.length===0;
 const active=folded.find(b=>b.dataset.id===tab);
 more.innerHTML=(active?esc(active.textContent.trim()):'更多分类')+icon('down');more.classList.toggle('active',!!active);more.title=active?'当前分类：'+active.textContent.trim()+'，点击切换更多分类':'更多分类';
}
function bindCategoryOverflow(){categoryTabObserver?.disconnect();layoutCategoryTabs();const nav=document.querySelector('#recommendScroll .tabline');if(nav&&typeof ResizeObserver!=='undefined'){categoryTabObserver=new ResizeObserver(layoutCategoryTabs);categoryTabObserver.observe(nav)}}
function showCategoryOverflow(){
 const more=document.getElementById('categoryMoreButton');if(!more)return;
 if(document.getElementById('categoryOverflow')){closeCategoryOverflow();return}
 const cats=[...document.querySelectorAll('[data-business-category]')].filter(b=>b.hidden);if(!cats.length)return;
 const box=document.createElement('div');box.id='categoryOverflow';box.className='category-overflow-panel';box.setAttribute('aria-label','更多业务分类');
 box.innerHTML='<div class="overflow-heading">更多分类</div>'+cats.map(b=>`<button class="${b.dataset.id===tab?'active':''}" data-action="tab" data-id="${esc(b.dataset.id)}">${esc(b.textContent.trim())}${b.dataset.id===tab?icon('check'):''}</button>`).join('');
 document.body.appendChild(box);const rect=more.getBoundingClientRect();box.style.left=Math.max(12,Math.min(rect.right-240,window.innerWidth-252))+'px';box.style.top=Math.max(12,Math.min(rect.bottom+8,window.innerHeight-box.offsetHeight-12))+'px';more.setAttribute('aria-expanded','true');box.querySelector('button')?.focus();
}

function activeSuggestions(){if(!db.rules.ai||!db.prefs[db.user])return [];return suggestions.filter(s=>!(db.dismissed[db.user+'-'+s.id]>Date.now())&&!db.commands.some(c=>c.owner===db.user&&c.suggestion===s.id&&!c.deleted)).slice(0,5)}

const choiceType=t=>['select','radio','multiselect'].includes(t);
const fieldText=(p,v)=>Array.isArray(v)?v.join('、'):String(v||'');
function inlineFieldHTML(p,i){
 const v=source?.values?.[p.key],text=fieldText(p,v),placeholder=(choiceType(p.type)?'选择':'填写')+p.key+(p.required?'':'（选填）');
 let control;
 if(p.type==='select')control=`<select data-inline-index="${i}" aria-label="${esc(p.key)}" aria-required="${p.required}"><option value="">${esc(placeholder)}</option>${p.options.map(o=>`<option value="${esc(o)}" ${o===text?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 else if(['radio','multiselect'].includes(p.type))control=`<button type="button" data-action="inline-choice" data-id="${i}" aria-label="${esc(placeholder)}" aria-haspopup="dialog">${esc(text||placeholder)}${icon('down')}</button>`;
 else control=`<input data-inline-index="${i}" aria-label="${esc(p.key)}" aria-required="${p.required}" maxlength="${p.type==='textarea'?2000:200}" value="${esc(text)}" placeholder="${esc(placeholder)}" style="width:${Math.min(380,Math.max(115,((text||placeholder).length+1)*14))}px">`;
 return `<span class="inline-field ${text?'filled':''}" contenteditable="false" data-field-index="${i}">${control}</span>`;
}
function composerEditorHTML(){
 if(!source?.params?.length)return `<textarea id="composerInput" aria-label="工作需求" placeholder="输入工作需求，或选择上方指令开始…">${esc(draft)}</textarea>`;
 const body=source.richHTML||esc(source.template).replace(/\{\{([^{}]+)\}\}/g,(_,key)=>{const i=source.params.findIndex(p=>p.key===key);return i>=0?inlineFieldHTML(source.params[i],i):esc('{{'+key+'}}')});
 return `<div id="richComposer" class="rich-composer" contenteditable="true" role="textbox" aria-label="工作需求，蓝色部分可直接填写或选择" aria-multiline="true">${body}</div><div id="inlineHint" class="inline-hint">蓝色部分可直接填写或选择，正文也可编辑</div>`;
}
function resolveInlineTemplate(s){
 return s.template.replace(/\{\{([^{}]+)\}\}/g,(_,key)=>{const p=s.params.find(x=>x.key===key);return fieldText(p,s.values[key])||(p?.required?'【待填写：'+key+'】':'未提供')});
}
function serializeRich(node){
 if(node.nodeType===3)return node.textContent;
 if(node.nodeType!==1)return '';
 if(node.hasAttribute('data-field-index')){const p=source.params[Number(node.dataset.fieldIndex)];return fieldText(p,source.values[p.key])||(p.required?'【待填写：'+p.key+'】':'未提供')}
 if(node.tagName==='BR')return '\n';
 const text=Array.from(node.childNodes).map(serializeRich).join('');
 return ['DIV','P'].includes(node.tagName)&&node.id!=='richComposer'?'\n'+text:text;
}
function syncRich(){
 const root=document.getElementById('richComposer');if(!root||!source)return;
 root.querySelectorAll('[data-inline-index]').forEach(el=>{const p=source.params[Number(el.dataset.inlineIndex)];source.values[p.key]=el.value;if(el.tagName==='INPUT')el.setAttribute('value',el.value);else Array.from(el.options).forEach(o=>{if(o.selected)o.setAttribute('selected','');else o.removeAttribute('selected')});el.closest('.inline-field').classList.toggle('filled',!!el.value.trim())});
 source.richHTML=root.innerHTML;draft=serializeRich(root);updateComposerParts();
}
function updateInlineHint(){

 el.textContent=missing?'蓝色部分可直接填写或选择 · 还有'+missing+'项必填':'信息已补充，可继续编辑正文或发送';

 el.addEventListener('change',()=>{source.values[p.key]=multi?Array.from(el.querySelectorAll('input:checked')).map(x=>x.value):el.querySelector('input:checked')?.value||'';refreshInlineField(index);if(!multi){closeInlinePicker();document.querySelector('[data-field-index="'+index+'"] button')?.focus()}});

function refreshInlineField(index){

function validateInline(){
 if(!source?.params?.length)return true;
 syncRich();const root=document.getElementById('richComposer');
 const missing=source.params.filter((p,i)=>p.required&&(!fieldText(p,source.values[p.key]).trim()||!root?.querySelector('[data-field-index="'+i+'"]')));
 if(!missing.length)return true;
 source.params.forEach((p,i)=>root?.querySelectorAll('[data-field-index="'+i+'"]').forEach(el=>el.classList.toggle('invalid',missing.includes(p))));
 const hint=document.getElementById('inlineHint');if(hint){hint.textContent='请补充：'+missing.map(p=>p.key).join('、')+'。误删的高亮字段可重新点击模版恢复。';hint.classList.add('error-hint')}

function analyticsData(days=analyticsDays,now=Date.now()){
 const day=86400000,offset=8*3600000,end=Math.floor((now+offset)/day)*day-offset+day,start=end-days*day;
 const commands=db.commands.filter(c=>c.source==='organization'&&!c.deleted),ids=new Set(commands.map(c=>c.id));
 const events=db.events.filter(e=>ids.has(e.id)&&e.time>=start&&e.time<=now);
 const previous=db.events.filter(e=>ids.has(e.id)&&e.time>=start-days*day&&e.time<start);
 const rows=commands.map(c=>{const uses=events.filter(e=>e.id===c.id);return {c,count:uses.length,users:new Set(uses.map(e=>e.uid)).size,favorites:Object.values(db.favs).filter(fs=>fs.some(f=>f.id===c.id)).length}});
 const unused=rows.filter(r=>r.c.enabled&&r.count===0);
 const buckets=Array.from({length:days},(_,i)=>{const time=start+i*day;return {time,count:events.filter(e=>e.time>=time&&e.time<time+day).length,label:new Date(time+offset).toISOString().slice(5,10)}});
 return {rows,unused,buckets,count:events.length,users:new Set(events.map(e=>e.uid)).size,used:rows.filter(r=>r.count>0).length,previous:previous.length};
}
function analyticsHTML(){
 const d=analyticsData(),change=d.previous?((d.count-d.previous)/d.previous*100).toFixed(1)+'%':null;
 const sorted=analyticsRank==='unused'?d.unused:d.rows.filter(r=>analyticsRank==='uses'?r.count>0:r.favorites>0).sort((a,b)=>analyticsRank==='favorites'?b.favorites-a.favorites||b.count-a.count:b.count-a.count||b.users-a.users).slice(0,5);
 const max=Math.max(1,...d.buckets.map(b=>b.count)),barW=800/d.buckets.length;
 const chart=d.buckets.map((b,i)=>{const height=b.count/max*105,x=i*barW+6,y=124-height;return `<g tabindex="0"><title>${b.label}：${b.count}次</title><rect x="${x}" y="${y}" width="${Math.max(4,barW-12)}" height="${Math.max(2,height)}" rx="3" fill="${b.count?'#4b85ff':'#e8edf5'}"/>${i===0||i===d.buckets.length-1||i%Math.ceil(d.buckets.length/6)===0?`<text x="${x}" y="147" font-size="11" fill="#8c97a7">${b.label}</text>`:''}</g>`}).join('');
 return `<div class="analytics-toolbar"><div><strong>模版使用概况</strong><p>只统计组织任务模版，不包含“我的”私有指令。</p></div><div class="analytics-period">${[7,30].map(n=>`<button class="${analyticsDays===n?'active':''}" data-action="analytics-days" data-id="${n}">近 ${n} 天</button>`).join('')}</div></div>
 <div class="analytics-metrics">${[['使用次数',d.count,change?'较前一等长周期 '+(Number(change.slice(0,-1))>0?'+':'')+change:'前一等长周期无使用数据'],['使用人数',d.users,'按使用者去重'],['被使用模版',d.used,'周期内至少使用 1 次'],['未使用模版',d.unused.length,'当前启用且周期内 0 次使用']].map(([name,value,note])=>`<div class="panel metric"><span>${name}</span><strong>${value}</strong><small>${note}</small></div>`).join('')}</div>
 <div class="panel analytics-trend"><div class="analytics-heading"><strong>使用趋势</strong><span>每日实际提交次数 · 北京时间</span></div>${d.count?`<svg viewBox="0 0 812 160" role="img" aria-label="近${analyticsDays}天使用趋势，共${d.count}次"><line x1="0" y1="126" x2="812" y2="126" stroke="#e8edf5"/>${chart}</svg><div class="trend-scale">单日最高 ${max} 次 · 悬停柱形查看每日次数</div>`:'<div class="analytics-empty">本周期暂无使用记录，用户提交模版任务后会显示趋势。</div>'}</div>
 <div class="panel"><div class="analytics-heading"><div class="analytics-tabs">${[['uses','使用最多'],['favorites','收藏最多'],['unused','无人使用']].map(([id,label])=>`<button class="${analyticsRank===id?'active':''}" data-action="analytics-rank" data-id="${id}">${label}${id==='unused'?' · '+d.unused.length:''}</button>`).join('')}</div><span>${analyticsRank==='unused'?'当前启用模版':analyticsRank==='favorites'?'当前累计收藏 · Top 5':'所选周期 · Top 5'}</span></div>
 <div class="analytics-explain">${analyticsRank==='uses'?'看哪些模版被反复使用，同时参考使用人数，避免只看少数人的高频使用。':analyticsRank==='favorites'?'用收藏人数观察用户偏好；这是当前累计收藏，不是所选周期内新增收藏。':'查看周期内未被使用的已启用模版，可检查内容、可见范围和推荐位置；新模版暂未使用不代表无价值。'}</div>
 <div class="tablewrap"><table><thead><tr><th>任务模版</th><th>分类</th><th>使用次数</th><th>使用人数</th><th>当前收藏人数</th></tr></thead><tbody>${sorted.map(r=>`<tr><td><div class="rowname">${esc(r.c.name)}</div></td><td>${esc(findCat(r.c.cat)?.name||'—')}</td><td>${r.count}</td><td>${r.users}</td><td>${r.favorites}</td></tr>`).join('')||'<tr><td colspan="5" class="analytics-empty">'+(analyticsRank==='unused'?'本周期没有未使用的已启用模版':analyticsRank==='favorites'?'暂无收藏数据':'本周期暂无使用数据')+'</td></tr>'}</tbody></table></div></div>
 <p class="analytics-footnote">统计口径：实际提交任务计为使用，点击卡片或填入输入框不计数。周期包含今天；未使用不包含停用模版，已删除模版不纳入此页。数据来自本地演示记录，未接入真实业务。</p>`;
}

function categoryManagerHTML(){const cats=liveCats(),count=id=>db.commands.filter(c=>!c.deleted&&c.source==='organization'&&(id==='all'||c.cat===id)).length;return `<aside class="category-manager" aria-label="分类管理"><header>分类管理<button class="mini" data-action="category-create" title="新增分类" ${sortState?'disabled':''}>${icon('plus')}</button></header><div class="category-row ${adminCat==='all'?'selected':''}"><button class="category-select" data-action="category-filter" data-id="all" ${sortState?'disabled':''}>${icon('grid')}<span>全部模版</span></button></div>${cats.map((c,i)=>`<div class="category-row ${adminCat===c.id?'selected':''}" data-category-row="${c.id}" draggable="${!sortState}"><button class="category-select" data-action="category-filter" data-id="${c.id}" ${sortState?'disabled':''}><span>${esc(c.name)}</span></button><div class="category-actions"><button class="mini" title="上移分类" data-action="category-up" data-id="${c.id}" ${i===0||sortState?'disabled':''}>${icon('up')}</button><button class="mini" title="下移分类" data-action="category-down" data-id="${c.id}" ${i===cats.length-1||sortState?'disabled':''}>${icon('down')}</button><details class="category-more" ${sortState?'inert':''}><summary class="mini" aria-label="${esc(c.name)}的更多操作" title="更多操作">${icon('more')}</summary><div class="category-menu"><button type="button" data-action="category-edit" data-id="${c.id}">${icon('edit')}编辑</button><button type="button" class="danger" data-action="category-delete" data-id="${c.id}">${icon('trash')}删除</button></div></details></div></div>`).join('')}<div class="category-help">拖动分类或点击上下箭头排序，自动保存并同步首页。<br>分类仅用于归类，使用权限在模版中设置。</div></aside>`}
function reorderCategories(id,target){if(!adminGuard()||sortState)return;const cats=liveCats(),from=cats.findIndex(c=>c.id===id),to=cats.findIndex(c=>c.id===target);if(from<0||to<0||from===to)return;cats.splice(to,0,cats.splice(from,1)[0]);cats.forEach((c,i)=>{c.order=i;c.rev++});log('排序','模版分类','同步首页分类顺序');persist();renderAdminContent()}

function deleteCategory(id){if(!adminGuard())return;const c=findCat(id);if(!c||c.deleted)return;if(db.commands.some(q=>!q.deleted&&q.cat===id))return notify('分类下仍有模版，请先移到其他分类后再删除');confirmAction('删除分类？','仅删除这个空分类，不会删除任务模版。原型不提供恢复入口。',()=>{c.deleted=true;c.rev++;if(adminCat===id)adminCat='all';log('删除分类',c.name);persist();render();notify('空分类已删除，无法在原型内恢复')},true)}

function openEditor(id,kind='command',candidate=null){if(kind!=='personal'&&!adminGuard())return;const personal=kind==='personal',category=kind==='category';const old=id?(category?findCat(id):findCmd(id)):null;if(personal&&old?.owner!==db.user&&old)return notify('仅本人可编辑');const data=old?clone(old):{name:candidate?.name||'',description:candidate?.description||'',prompt:candidate?.prompt||'',params:clone(candidate?.params||[]),cat:adminCat!=='all'?adminCat:liveCats()[0]?.id||'',scope:personal?{mode:'owner'}:allScope(),icon:candidate?.icon||(personal?'person':''),enabled:personal,source:personal?'personal':'organization'};const title=personal?(old?'编辑我的任务指令':candidate?'自定义并保存到我的':'创建我的任务指令'):`${old?'编辑':'新增'}${category?'分类':'模版'}`;
 if(!category&&!data.icon)data.icon=personal?'person':findCat(data.cat)?.icon||'doc';
 showModal(title,`<form id="editForm">${!category?personalLogoHTML(data.icon):''}<div class="field"><label for="eName">名称<span class="required">*</span></label><input id="eName" value="${esc(data.name)}" required minlength="2" maxlength="${category?20:30}" placeholder="例如：${category?'公文处理':'起草工作通知'}"></div><div class="field"><label for="eDesc">描述${category?'':'<span class="required">*</span>'}</label><textarea id="eDesc" maxlength="100" ${category?'':'required minlength="5"'} style="min-height:65px" placeholder="说明这条${category?'分类':'指令'}能帮助用户完成什么">${esc(data.description)}</textarea></div>${!category&&!personal?`<div class="field"><label for="eCat">所属分类<span class="required">*</span></label><select id="eCat" required>${liveCats().map(c=>`<option value="${c.id}" ${c.id===data.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:''}${!category?`<div class="field"><label for="ePrompt">提示词<span class="required">*</span></label><textarea id="ePrompt" required minlength="10" maxlength="10000" style="min-height:175px" placeholder="请根据{{事项}}…">${esc(data.prompt)}</textarea><small>10～10000字。使用 {{参数名}} 定义待填信息。</small></div>`:''}${personal?'<div class="infobox">个人指令 · 仅自己可见。保存后不会发布到组织目录。</div>':category?'':`${category?'':scopeHTML(data.scope,false)}${category?'':`<div class="field"><label for="eEnabled">状态</label><select id="eEnabled"><option value="false" ${!data.enabled?'selected':''}>停用</option><option value="true" ${data.enabled?'selected':''}>启用</option></select><small>启用后，符合可见范围的用户可在首页使用。</small></div>`}`}<div id="editorError"></div></form>`,`${category?'':`<button class="btn left" data-action="editor-preview">${icon('eye')}预览内容</button>`}<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="save-editor">${personal&&!old?'保存到我的':old?.enabled?'保存并生效':'保存'}</button>`,!category,'editor',id||'');
 if(category)document.querySelector('#overlay .dialog')?.classList.add('category-dialog');
 editor={kind,id,original:old,params:data.params||[],icon:data.icon||'',candidate:candidate?.id,baseRev:old?.rev};renderParamEditor();document.getElementById('scopeMode')?.addEventListener('change',e=>document.getElementById('scopeChoices').classList.toggle('hidden',e.target.value!=='selected'));

function renderParamEditor(){const root=document.getElementById('paramEditor');if(!root||!editor)return;root.innerHTML=editor.params.length?editor.params.map((p,i)=>`<div class="paramitem" data-param-index="${i}"><div class="field-row"><input class="pkey" aria-label="参数名称" value="${esc(p.key)}" readonly><select class="ptype" aria-label="参数类型"><option value="text" ${p.type==='text'?'selected':''}>单行文本</option><option value="textarea" ${p.type==='textarea'?'selected':''}>多行文本</option><option value="select" ${p.type==='select'?'selected':''}>下拉选择</option><option value="radio" ${p.type==='radio'?'selected':''}>单选</option><option value="multiselect" ${p.type==='multiselect'?'selected':''}>多选</option></select></div><div class="bottom"><label><input type="checkbox" class="prequired" ${p.required?'checked':''}>必填</label><span class="subtle">与提示词占位符保持一致</span></div><input class="poptions ${!choiceType(p.type)?'hidden':''}" style="margin-top:10px" aria-label="枚举选项" placeholder="枚举选项，用中文逗号分隔" value="${esc(p.options.join('，'))}"></div>`).join(''):'<div class="demo-note">无需补充参数，点击卡片后可直接填入输入框。</div>';root.querySelectorAll('.ptype').forEach(e=>e.addEventListener('change',()=>e.closest('.paramitem').querySelector('.poptions').classList.toggle('hidden',!choiceType(e.value))))}

function getEditorData(){const category=editor.kind==='category',personal=editor.kind==='personal';return {name:document.getElementById('eName').value.trim(),description:document.getElementById('eDesc').value.trim(),...(!category?{prompt:document.getElementById('ePrompt').value.trim(),params:personalParams(),cat:personal?null:document.getElementById('eCat').value}:{}),scope:personal?{mode:'owner'}:category?allScope():readScope(),enabled:personal||category?true:document.getElementById('eEnabled').value==='true',icon:editor.icon}}
function validateEditor(data){const category=editor.kind==='category',personal=editor.kind==='personal';if([...data.name].length<2||[...data.name].length>(category?20:30))return '名称长度不符合要求';if(!category&&[...data.description].length<5)return '描述至少5个字';if(['全部','常用','收藏','我的','猜你要用'].includes(data.name)&&category)return '这是系统保留名称，请使用业务分类名称';const duplicate=category?liveCats().some(c=>c.id!==editor.id&&c.name===data.name):db.commands.some(c=>!c.deleted&&c.id!==editor.id&&c.name===data.name&&(personal?c.owner===db.user:c.source==='organization'&&c.cat===data.cat));if(duplicate)return '同一范围内已有这个名称，请修改';if(!personal&&!validScope(data.scope))return '指定范围不能为空，请至少选择一个部门、标签或人员';if(!category){if(data.prompt.length<10)return '提示词至少10个字';const keys=Array.from(data.prompt.matchAll(/\{\{([^{}]+)\}\}/g)).map(m=>m[1]);if(data.prompt.replace(/\{\{([^{}]+)\}\}/g,'').match(/[{}]/))return '占位符格式不正确，请使用 {{参数名}}';if(keys.some(k=>!/^[\p{L}\p{N}_]{1,30}$/u.test(k)))return '参数名称只允许中英文、数字、下划线，长度1～30';const params=data.params;if(params.length>10)return '参数最多10个';if(new Set(keys).size!==params.length||keys.some(k=>!params.some(p=>p.key===k)))return '参数配置与提示词不一致，请检查提示词中的占位符';if(params.some(p=>choiceType(p.type)&&(p.options.length<2||p.options.length>20||p.options.some(o=>[...o].length>30))))return '下拉、单选和多选需配置2～20个选项，每项不超过30字';if(!personal&&(!findCat(data.cat)||findCat(data.cat).deleted))return '请选择有效分类';}return null}
function saveEditor(){if(!editor)return;if(editor.kind!=='personal'&&!adminGuard())return;if(!document.getElementById('editForm').reportValidity())return;const data=getEditorData(),error=validateEditor(data);if(error)return editorError(error);const old=editor.original,current=editor.id?(editor.kind==='category'?findCat(editor.id):findCmd(editor.id)):null;if(old&&(!current||current.rev!==editor.baseRev))return editorError('配置已被修改，请关闭后重新编辑');const kind=editor.kind,candidate=editor.candidate;if(kind==='personal'&&old?.owner!==db.user&&old)return editorError('仅本人可编辑个人指令');if(old?.enabled&&kind==='command'&&!window.confirm('保存后将对后续使用立即生效，已运行任务保持原内容。确定保存吗？'))return;
 const list=kind==='category'?db.cats:db.commands;const id=old?.id||'custom'+Date.now()+Math.random().toString(36).slice(2,6);let execChanged=old&&JSON.stringify([old.prompt,old.params,old.cat])!==JSON.stringify([data.prompt,data.params,data.cat]);const record={...(old||{}),...data,id,rev:(old?.rev||0)+1,updated:Date.now(),order:old?(old.cat!==data.cat&&kind==='command'?Math.max(-1,...db.commands.filter(c=>c.cat===data.cat).map(c=>c.order))+1:old.order):Math.max(-1,...list.map(c=>c.order||0))+1};if(kind==='category'){delete record.scope;delete record.enabled;record.color=old?.color||'#527ac4';record.tint=old?.tint||'#eff4ff'}else{record.source=kind==='personal'?'personal':'organization';record.execRev=(old?.execRev||1)+(execChanged?1:0);if(kind==='personal'){record.owner=db.user;if(candidate)record.suggestion=candidate}}
 if(old)list.splice(list.findIndex(c=>c.id===id),1,record);else list.push(record);if(kind==='personal'){tab='mine';limit=6;db.views[db.user]='mine';}if(kind!=='personal')log(old?'编辑':'新增',record.name,kind==='category'?'更新分类信息':`指令 · ${record.enabled?'启用':'停用'} · ${scopeLabel(record.scope)}`);persist();closeModal(true);render();notify(kind==='personal'?'已保存到我的，仅你可见':'已保存，首页配置已同步')}
function toggleObject(id){if(!adminGuard())return;const category=adminTab==='categories',c=category?findCat(id):findCmd(id);if(!c||c.deleted)return;if(!c.enabled){if(!validScope(c.scope))return notify('指定范围不能为空，请先编辑');c.enabled=true;c.rev++;log('启用',c.name);render();return notify('已启用，符合范围的用户可见')}const count=category?db.commands.filter(q=>q.cat===id&&q.enabled&&!q.deleted).length:0;confirmAction('确认停用？',category?`该分类下的${count}条启用指令将从首页隐藏，常用和收藏也不可继续使用。`:'停用后，该指令将在首页隐藏，已有收藏显示为暂不可用。',()=>{c.enabled=false;c.rev++;log('停用',c.name);render();notify('已停用')})}
function deleteObject(id,personal=false){if(!personal&&!adminGuard())return;const category=!personal&&adminTab==='categories',c=category?findCat(id):findCmd(id);if(!c||c.deleted)return;if(personal&&c.owner!==db.user)return notify('仅本人可删除');if(!personal&&c.enabled)return notify('请先停用，再删除');if(category&&db.commands.some(q=>q.cat===id&&!q.deleted))return notify('分类下仍有指令，请先移走或删除这些指令');confirmAction('删除'+(category?'分类':'指令')+'？','删除后入口与收藏引用将失效，历史任务仍保留。此原型不提供恢复入口。',()=>{c.deleted=true;c.rev++;if(!personal)log('删除',c.name);persist();render();notify('已删除')},true)}
function startSort(){if(!adminGuard())return;const category=adminTab==='categories';if(!category&&adminCat==='all')return notify('请先选择一个分类，再调整该分类内的指令顺序');adminSearch='';adminStatus='all';const rows=category?liveCats():db.commands.filter(c=>!c.deleted&&c.source==='organization'&&c.cat===adminCat).sort((a,b)=>a.order-b.order);sortState={ids:rows.map(c=>c.id),revs:Object.fromEntries(rows.map(c=>[c.id,c.rev]))};renderAdminContent()}
function moveSort(id,delta){if(!sortState)return;const idx=sortState.ids.indexOf(id),to=idx+delta;if(idx<0||to<0||to>=sortState.ids.length)return;[sortState.ids[idx],sortState.ids[to]]=[sortState.ids[to],sortState.ids[idx]];renderAdminContent()}
function saveSort(){if(!adminGuard()||!sortState)return;const get=adminTab==='categories'?findCat:findCmd;if(sortState.ids.some(id=>get(id)?.rev!==sortState.revs[id]))return notify('配置已变更，请取消排序后重试');sortState.ids.forEach((id,i)=>{get(id).order=i;get(id).rev++});log('排序',adminTab==='categories'?'业务分类':findCat(adminCat)?.name||'指令','更新显示顺序');sortState=null;renderAdminContent();notify('排序已保存')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;e.stopPropagation();switch(a){
 case 'home':if(modal&&!closeModal())return;view='home';activeRun=null;sortState=null;render();break;
 case 'new':{const go=()=>{closeModal(true);view='home';activeRun=null;draft='';source=null;attachments=[];sortState=null;render()};if(draft.trim())confirmAction('开始新任务？','当前输入尚未发送，开始新任务会清空草稿。',go);else go();break}
 case 'refresh':render();notify('已刷新当前演示配置');break;
 case 'outside':notify('此入口沿用现有产品，本原型聚焦新建任务与任务模版管理');break;
 case 'history':notify('此处为界面参考历史，本原型不读取真实会话');break;
 case 'demo':demoSettings();break;case 'guide':guide();break;
 case 'guide-home':closeModal(true);view='home';activeRun=null;tab='all';render();break;
 case 'guide-use':closeModal(true);view='home';beginUse('q1');break;
 case 'switch-account':switchUser(document.querySelector('input[name="demoAccount"]:checked').value);notify('已切换演示账号');break;
 case 'demo-admin':if(!closeModal())return;db.user='u4';view='admin';draft='';source=null;attachments=[];activeRun=null;sortState=null;persist();render();break;
 case 'admin':if(!adminGuard())return;if(!closeModal())return;adminTab='commands';view='admin';activeRun=null;sortState=null;render();break;
 case 'admin-outside':notify('本原型展示任务模版管理，其他菜单沿用现有管理后台');break;
 case 'admin-query':adminSearch=document.getElementById('adminSearch').value.trim();adminStatus=document.getElementById('adminStatus').value;renderAdminContent();break;
 case 'admin-reset':adminSearch='';adminStatus='all';adminCat='all';renderAdminContent();break;
 case 'demo-empty':db.events=db.events.filter(x=>x.uid!==db.user);db.favs[db.user]=[];db.prefs[db.user]=false;persist();closeModal(true);view='home';tab='frequent';activeRun=null;render();notify('当前示例账号已设为新用户状态');break;
 case 'experience-ai':if(!db.rules.ai)return notify('租户历史建议已关闭，请到后台开启');db.prefs[db.user]=true;db.dismissed={};persist();closeModal(true);view='home';activeRun=null;draft='';source=null;render();notify('已开启示例历史建议，可点击输入框上方“猜你要用”');break;
 case 'reset':confirmAction('重置全部演示数据？','将恢复初始分类、指令、收藏和演示使用记录，仅影响本浏览器中的此原型。',()=>{db=seed();migrateCategorySettings(db);view='home';tab='all';draft='';source=null;attachments=[];activeRun=null;sortState=null;limit=6;persist();render();notify('已恢复初始演示数据')},true);break;
 case 'category-overflow':showCategoryOverflow();break;
 case 'tab':tab=id;limit=6;db.views[db.user]=id;persist();renderHome();break;
 case 'more':{const y=document.getElementById('recommendScroll').scrollTop;limit+=6;renderHome();document.getElementById('recommendScroll').scrollTop=y;break}
 case 'favorite':toggleFavorite(id);break;case 'detail':showDetail(id);break;case 'use':beginUse(id);break;
 case 'inline-choice':showInlinePicker(Number(id),b);break;
 case 'inline-done':closeInlinePicker();break;
 case 'inline-clear':{const i=Number(id),p=source?.params?.[i];if(p){source.values[p.key]=p.type==='multiselect'?[]:'';refreshInlineField(i)}closeInlinePicker();break}
 case 'undo-fill':if(composerUndo?.uid===db.user){const saved=composerUndo;composerUndo=null;closeInlinePicker();draft=saved.draft;source=saved.source;renderHome();focusComposer()}break;
 case 'unlink':if(source?.params?.length)syncRich();source=null;closeInlinePicker();renderHome();document.getElementById('composerInput')?.focus();notify('已转为普通文字，可继续编辑');break;
 case 'attach':document.getElementById('files').click();break;case 'remove-attachment':attachments.splice(Number(id),1);updateComposerParts();break;
 case 'tool':showModal(id,`<div class="infobox">这里沿用现有超级助手的${esc(id)}选择器。本离线原型不连接真实${esc(id)}服务；可以继续体验指令填写、发送及后台配置。</div>`,'<button class="btn primary" data-action="close">知道了</button>');break;
 case 'send':send();break;case 'close':closeModal();break;
 case 'confirm':{const fn=pendingAction;pendingAction=null;closeModal(true);fn?.();break}
 case 'suggestion':showSuggestion(id);break;
 case 'dismiss':db.dismissed[db.user+'-'+id]=Date.now()+30*86400000;persist();closeModal(true);render();notify('已隐藏，30天内不再推荐同类候选');break;
 case 'use-suggestion':beginUse(id,true);break;
 case 'save-suggestion':{const c=db.commands.find(c=>c.owner===db.user&&c.suggestion===id&&!c.deleted);if(c){closeModal(true);return showDetail(c.id)}openEditor(null,'personal',suggestions.find(s=>s.id===id));break}
 case 'new-personal':openEditor(null,'personal');break;
 case 'copy-personal':{const c=findCmd(id);if(!available(c))return notify('该指令暂不可用');const copy=clone(c);delete copy.id;copy.name=[...c.name].slice(0,26).join('')+'（我的）';openEditor(null,'personal',copy);break}
 case 'edit-personal':openEditor(id,'personal');break;case 'delete-personal':deleteObject(id,true);break;
 case 'preferences':preferences();break;
 case 'save-preferences':savePersonalPreferences();break;
 case 'category-filter':if(sortState)return;adminCat=id;adminSearch='';adminStatus='all';renderAdminContent();break;
 case 'category-create':openEditor(null,'category');break;
 case 'category-edit':openEditor(id,'category');break;
 case 'category-delete':deleteCategory(id);break;
 case 'category-up':case 'category-down':{const cats=liveCats(),i=cats.findIndex(c=>c.id===id),target=cats[i+(a==='category-up'?-1:1)];if(target)reorderCategories(id,target.id);break}
 case 'operation-logs':if(!adminGuard())return;adminTab='logs';view='admin';render();break;
 case 'analytics-days':analyticsDays=Number(id)===7?7:30;renderAdminContent();break;
 case 'analytics-rank':analyticsRank=['uses','favorites','unused'].includes(id)?id:'uses';renderAdminContent();break;
 case 'admin-tab':adminTab=id;adminSearch='';adminStatus='all';sortState=null;renderAdminChrome();renderAdmin();break;
 case 'create':openEditor(null,adminTab==='categories'?'category':'command');break;
 case 'edit':openEditor(id,adminTab==='categories'?'category':'command');break;case 'preview':showDetail(id,true);break;
 case 'toggle':toggleObject(id);break;case 'delete':deleteObject(id);break;
 case 'template-up':case 'template-down':{const c=findCmd(id);if(!c)return;const items=categoryTemplates(c.cat),i=items.findIndex(x=>x.id===id),dest=items[i+(a==='template-up'?-1:1)];if(dest)reorderTemplates(id,dest.id);break}
 case 'sort':startSort();break;case 'move-up':moveSort(id,-1);break;case 'move-down':moveSort(id,1);break;case 'cancel-sort':sortState=null;renderAdminContent();break;case 'save-sort':saveSort();break;
 case 'choose-icon':editor.icon=id;document.querySelectorAll('.iconchoice').forEach(el=>{el.classList.toggle('selected',el.dataset.id===id);el.setAttribute('aria-pressed',String(el.dataset.id===id))});const logoPreview=document.getElementById('personalLogoPreview');if(logoPreview)logoPreview.innerHTML=icon(id||'person');modal.dirty=true;break;
 case 'sync-params':{const p=document.getElementById('ePrompt').value;const keys=[...new Set(Array.from(p.matchAll(/\{\{([^{}]+)\}\}/g)).map(m=>m[1]))];if(keys.length>10)return editorError('参数最多10个');const old=readParams();editor.params=keys.map(key=>old.find(p=>p.key===key)||{key,type:'text',required:true,options:[]});renderParamEditor();modal.dirty=true;notify(`已识别${keys.length}个参数`);break}
 case 'editor-preview':{const data=getEditorData();const err=validateEditor(data);if(err)return editorError(err);let el=document.getElementById('inlinePreview');if(!el){el=document.createElement('div');el.id='inlinePreview';document.getElementById('editForm').appendChild(el)}el.innerHTML=`<div class="sectionlabel">内容预览</div><div class="promptpreview"><strong>${esc(data.name)}</strong>\n${esc(data.description)}${data.prompt?'\n\n'+esc(data.prompt):''}</div>`;el.scrollIntoView({block:'nearest'});break}
 case 'save-editor':saveEditor();break;
 }});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){e.preventDefault();closeModal();return}if(modal&&e.key==='Tab'){const nodes=[...document.querySelectorAll('.dialog button:not(:disabled),.dialog input:not(:disabled),.dialog select:not(:disabled),.dialog textarea:not(:disabled)')].filter(el=>el.offsetParent!==null);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.commandcard')){e.preventDefault();beginUse(e.target.dataset.id)}});
document.addEventListener('click',e=>{if(!e.target.closest('#inlinePicker,[data-action="inline-choice"]'))closeInlinePicker()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeInlinePicker()});
window.addEventListener('resize',closeInlinePicker);
document.addEventListener('click',e=>{document.querySelectorAll('.category-more[open]').forEach(menu=>{if(!menu.contains(e.target)||e.target.closest('.category-menu button'))menu.open=false})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.category-more[open]').forEach(menu=>{menu.open=false;menu.querySelector('summary')?.focus()})});
document.addEventListener('click',e=>{if(!e.target.closest('#categoryOverflow,#categoryMoreButton'))closeCategoryOverflow()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('categoryOverflow')){closeCategoryOverflow();document.getElementById('categoryMoreButton')?.focus()}});
window.addEventListener('resize',layoutCategoryTabs);
document.addEventListener('submit',e=>e.preventDefault());
document.getElementById('overlay').addEventListener('input',()=>{if(modal&&['editor','parameters'].includes(modal.kind))modal.dirty=true});
document.getElementById('overlay').addEventListener('change',()=>{if(modal&&['editor','parameters'].includes(modal.kind))modal.dirty=true});
document.getElementById('files').addEventListener('change',e=>{attachments.push(...Array.from(e.target.files).map(f=>({name:f.name,size:f.size})));e.target.value='';updateComposerParts();notify('已添加附件名称用于演示，文件不会上传或读取')});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{db=JSON.parse(e.newValue);migrateCategorySettings(db);render()}catch(_){}}});
render();persist();
</script>
