<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ChatGPT 背景设置</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="settings.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="settings-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">CHATGPT NEW TAB</p>
          <h1>背景设置</h1>
        </div>
        <label class="switch" aria-label="启用自定义背景">
          <input id="enabled" type="checkbox" />
          <span aria-hidden="true"></span>
        </label>
      </header>

      <label id="drop-zone" class="image-picker" for="image-file">
        <input
          id="image-file"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/avif"
        />
        <span class="image-picker__preview" aria-hidden="true"></span>
        <span class="image-picker__content">
          <strong id="image-title">选择本地图片</strong>
          <small id="image-help">PNG、JPEG、WebP 或 AVIF</small>
        </span>
      </label>

      <section class="controls" aria-label="显示设置">
        <label class="field field--select">
          <span>填充方式</span>
          <select id="fit">
            <option value="cover">铺满屏幕</option>
            <option value="contain">完整显示</option>
            <option value="repeat">原始尺寸平铺</option>
          </select>
        </label>

        <label class="field">
          <span>暗色遮罩 <output id="dimming-value" for="dimming">28%</output></span>
          <input id="dimming" type="range" min="0" max="80" step="1" />
        </label>

        <label class="field">
          <span>背景模糊 <output id="blur-value" for="blur">0 px</output></span>
          <input id="blur" type="range" min="0" max="20" step="1" />
        </label>

        <label class="field">
          <span>面板不透明度 <output id="surface-value" for="surface-opacity">78%</output></span>
          <input id="surface-opacity" type="range" min="45" max="100" step="1" />
        </label>
      </section>

      <footer class="footer-actions">
        <p id="status" role="status" aria-live="polite">图片只保存在这台设备上</p>
        <button id="remove-image" class="remove-button" type="button" hidden>移除图片</button>
      </footer>
    </main>
  </body>
</html>
